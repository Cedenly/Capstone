<text x="410" y="2675" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#183b59" font-weight="normal">Un error de configuración o de procesamiento puede devolver 503.</text>
<text x="410" y="2707" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#183b59" font-weight="normal">La transacción tiene un límite total de tres intentos; no es una cola durable.</text>
<text x="410" y="2739" text-anchor="start" font-family="Arial, sans-serif" font-size="23" fill="#183b59" font-weight="normal">Si se pierde la respuesta después del commit, la reentrega se reconoce por el recibo.</text>
<text x="35" y="2850" text-anchor="start" font-family="Arial, sans-serif" font-size="22" fill="#183b59" font-weight="normal">Fuentes: middleware de webhook, stripeWebhook.js y stripeBilling.js de la candidata local.</text>
<text x="35" y="2887" text-anchor="start" font-family="Arial, sans-serif" font-size="22" fill="#183b59" font-weight="normal">APR-91 en REV4 · 17/11/2026, 23:18 (Santiago) · Siete escenarios y 31 entregas HTTP con Firestore emulado y Stripe sintético.</text>
<text x="35" y="2924" text-anchor="start" font-family="Arial, sans-serif" font-size="22" fill="#183b59" font-weight="normal">La evidencia local no acredita Stripe remoto, despliegue ni integración con otros equipos.</text>
<text x="35" y="2965" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#183b59" font-weight="normal">Flujo principal de Checkout, facturas y suscripciones; customer.updated se detalla en el texto.</text>
